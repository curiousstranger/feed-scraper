# Generated by the feed-scraper selector-picker bookmarklet
# from https://www.anthropic.com/research on 2026-10-13.
# Selectors reworked by hand on 2026-11-09 after the site redesign that
# dropped the PublicationList/listItem markup. Each row is now an <article>
# whose <a> wraps only the title, hence link_selector. `?view=table` is a
# client-side toggle: the server returns the same HTML with or without it.

id: anthropic-research
name: "Research \\ Anthropic"
description: "Unofficial RSS feed scraped from https://www.anthropic.com/research"
listing_url: "https://www.anthropic.com/research"
base_url: "https://www.anthropic.com"

item_selector: 'article[class*="_article"][data-listing-row]'
link_selector: 'a[class*="metaTitleLink"]'
title_selector: 'a[class*="metaTitleLink"]'
date_selector: 'header time'
category_selector: 'header a'

# The hero carousel at the top can carry stories that never appear in the
# row listing, so scrape its slides too (inactive slides are still in the HTML).
featured_item_selector: 'div[class*="carousel-info-body"]'
featured_link_selector: 'a[class*="carousel-info-link"]'
featured_title_selector: 'a[class*="carousel-info-link"]'
featured_date_selector: 'header time'
featured_category_selector: 'header a'

fetch_detail: true
max_items: 75

user_agent: "Mozilla/5.0 (compatible; PersonalSiteRSSBot/1.0; run by a single subscriber for personal use)"
