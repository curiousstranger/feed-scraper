# Unofficial feed config for Anthropic's newsroom (anthropic.com has no RSS feed).
#
# The site is a Next.js app whose CSS class names carry a build-specific hash,
# e.g. "bxgyUW_title-link" (earlier builds used the longer
# "PublicationList-module-scss-module__KxYrHG__listItem" form). The hash
# (bxgyUW) can change whenever Anthropic redeploys the site, so selectors
# below use CSS "contains" matching ([class*="..."]) on the stable parts of
# the class name instead of matching the full hashed string. If Anthropic
# reworks the page layout entirely, these selectors will need to be
# re-derived (view-source the listing page and look for repeated <li>/<a>
# structures around each article).

id: anthropic-news
name: "Anthropic Newsroom (unofficial)"
description: "Unofficial RSS feed scraped from anthropic.com/news — Anthropic does not publish an official feed."
listing_url: "https://www.anthropic.com/news"
base_url: "https://www.anthropic.com"

# Selectors re-derived by hand on 2026-11-09 after the site redesign that
# dropped the PublicationList/FeaturedGrid markup. Each row is now an <li>
# carrying data-listing-row; its <a class="...title-link"> wraps only the
# headline, hence link_selector. (The row also holds a hidden "details"
# copy of the title/date/category, which the scoped selectors below skip.)
item_selector: 'li[class*="_row"][data-listing-row]'
link_selector: 'a[class*="title-link"]'

# Selectors below are evaluated *inside* each matched item element.
title_selector: 'a[class*="title-link"]'
date_selector: 'div[class*="_date"] time'
category_selector: 'a[class*="category-link"]'

# Above the rows sit three promo blocks that can carry stories the rows
# never show (e.g. a /research story as a tile, an older feature in the
# carousel), and the newest announcement lands in the hero first, so all
# three are scraped as the featured section:
#   - hero:     <article class="..._featured">
#   - tiles:    <article class="..._tile">
#   - carousel: <div class="...carousel-info-body"> (inactive slides are
#               still in the HTML)
# All share a <header> with the category link and <time>. The hero/tile
# link also wraps a summary paragraph, so the title comes from the
# headline element, not the link text.
featured_item_selector: 'article[class*="_featured"], article[class*="_tile"], div[class*="carousel-info-body"]'
featured_link_selector: 'a[class*="tileLink"], a[class*="carousel-info-link"]'
featured_title_selector: '[data-component="Headline"]'
featured_date_selector: 'header time'
featured_category_selector: 'header a'

# Fetch each new article's own page once (via OpenGraph meta tags) to get a
# description for the feed. Only runs for items not already in data/*.json.
fetch_detail: true

# Keep at most this many of the most recent items in the feed/state file.
max_items: 75

user_agent: "Mozilla/5.0 (compatible; PersonalSiteRSSBot/1.0; run by a single subscriber for personal use)"
