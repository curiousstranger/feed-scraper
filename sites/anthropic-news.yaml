# Unofficial feed config for Anthropic's newsroom (anthropic.com has no RSS feed).
#
# The site is a Next.js app whose CSS class names carry a build-specific hash,
# e.g. "PublicationList-module-scss-module__KxYrHG__listItem". The hash
# (KxYrHG) can change whenever Anthropic redeploys the site, so selectors
# below use CSS "contains" matching ([class*="..."]) on the stable parts of
# the class name instead of matching the full hashed string. If Anthropic
# reworks the page layout entirely, these selectors will need to be
# re-derived (view-source the listing page and look for repeated <li>/<a>
# structures around each article).

id: anthropic-news
name: "Anthropic Newsroom (unofficial)"
description: "Unofficial RSS feed scraped from anthropic.com/news — Anthropic does not publish an official feed."
listing_url: "https://www.anthropic.com/news"
base_url: "https://www.anthropic.com"

# Each matched element must itself be the <a href="..."> for one article.
item_selector: 'a[class*="PublicationList"][class*="listItem"]'

# Selectors below are evaluated *inside* each matched item element.
title_selector: 'span[class*="title"]'
date_selector: 'time'
category_selector: 'span[class*="subject"]'

# The page also has a separate "FeaturedGrid" promo block (top of the page)
# that highlights a handful of articles independent of the chronological
# PublicationList below it: one big hero item plus a column of "side" links.
# The hero is where the newest announcement lands, often before (or instead
# of) it reaching PublicationList, and some announcements (e.g. threat-intel
# reports) only ever appear as side links — so both are scraped here, or the
# feed silently goes stale. The hero's <a> is the "__content" element (the
# "__" anchors it so "featuredItemContent" doesn't match) with an <h2>
# title; side links are "sideLink" with an <h4> title. Category and date
# markup is shared.
featured_item_selector: 'a[class*="FeaturedGrid"][class*="__content"], a[class*="FeaturedGrid"][class*="sideLink"]'
featured_title_selector: 'h2[class*="featuredTitle"], h4[class*="title"]'
featured_date_selector: 'time'
featured_category_selector: 'span[class*="caption"]'

# Fetch each new article's own page once (via OpenGraph meta tags) to get a
# description for the feed. Only runs for items not already in data/*.json.
fetch_detail: true

# Keep at most this many of the most recent items in the feed/state file.
max_items: 75

user_agent: "Mozilla/5.0 (compatible; PersonalSiteRSSBot/1.0; run by a single subscriber for personal use)"
