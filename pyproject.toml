[project]
name = "feed-scraper"
version = "0.1.0"
description = "Generic site-to-RSS scraper"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "soupsieve>=2.5",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "feedgen>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
