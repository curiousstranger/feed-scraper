name: Update RSS feeds

on:
  schedule:
    # Every 4 hours, at :17 past the hour (offset to avoid the GitHub Actions
    # top-of-hour rush). Times are UTC.
    - cron: "17 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "sites/**"
      - "scraper/**"
      - ".github/workflows/update-feeds.yml"

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Run scraper
        run: uv run python -m scraper.run

      - name: Commit updated data & feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update feeds ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
