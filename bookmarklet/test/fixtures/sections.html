<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sections News</title></head>
<body>
<!-- Like anthropic.com/news: the page is a stack of same-marked sections that
     each hold a link, so clicking the hero climbs to "one section" (3 repeat),
     and one of those sections holds the main list. -->
<main>
  <div class="page-section">
    <div class="hero"><a class="hero__link" href="/news/hero"><h2 class="hero__title">The hero story</h2></a></div>
  </div>
  <div class="page-section">
    <ul class="list">
      <li><a class="row" href="/news/one"><span class="row__title">Story one</span></a></li>
      <li><a class="row" href="/news/two"><span class="row__title">Story two</span></a></li>
      <li><a class="row" href="/news/three"><span class="row__title">Story three</span></a></li>
    </ul>
  </div>
  <div class="page-section"><a href="/about">About us</a></div>
</main>
</body>
</html>
